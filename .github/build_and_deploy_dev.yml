name: Build and Deploy - Dev

on:
  push:
    branches:
      - develop
  workflow_dispatch:

jobs:
  print-github-ref:
    runs-on: arc-runner-set
    steps:
      - name: Print github.ref
        run: echo "github.ref is ${{ github.ref }}"
  call-reusable-workflow:
    uses: burnsmcd/cor-gcp-cicd-workflows/.github/workflows/build_and_deploy.yml@genericize
    with:
      artifact_registry_name: bmcd-jfrog
      container_repo_host: us-docker.pkg.dev
      container_repo_path: cor-docker-dev-centralus/cdb-epc-tools-sidepanel 
      dockerfile_path: Dockerfile
      environment: dev
      image_tag: ${{ github.sha }}
      project_id: cdb-epc-tools-dev-1f5b
      service_name: cdb-epc-tools-sidepanel-dev-cr
      
    secrets:
      DEPLOYMENT_SERVICE_ACCOUNT_KEY: ${{ secrets.DEPLOYMENT_SERVICE_ACCOUNT_KEY_DEV }} 
      ARTIFACTORY_USERNAME: ${{ secrets.ARTIFACTORY_USERNAME }} 
      ARTIFACTORY_TOKEN: ${{ secrets.ARTIFACTORY_TOKEN }} 